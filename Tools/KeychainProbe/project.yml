name: FlowLedgerProbe
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  FlowLedgerKeychainProbe:
    type: application
    platform: iOS
    sources:
      - path: ProbeApp.swift
      - path: ../../Shared/LedgerSnapshot.swift
      - path: ../../Shared/SharedLedgerStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jack.flowledger.keychainprobe
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
        CODE_SIGN_ENTITLEMENTS: Probe.entitlements
schemes:
  FlowLedgerKeychainProbe:
    build:
      targets:
        FlowLedgerKeychainProbe: all
