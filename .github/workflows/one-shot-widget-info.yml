name: One Shot Widget Info Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-widget-info.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build and package
        run: |
          set -euo pipefail
          rm -rf DerivedData Payload

          xcodebuild \
            -project NetFlow.xcodeproj \
            -scheme NetFlow \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          APP="$PWD/DerivedData/Build/Products/Release-iphoneos/NetFlow.app"
          WIDGET="$APP/PlugIns/NetFlowWidget.appex"

          test -d "$APP"
          test -d "$WIDGET"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "4.2.4"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "33"
          grep -q 'widget.plan.capacity' NetFlowWidget/NetFlowWidget.swift
          grep -q 'widget.plan.used' NetFlowWidget/NetFlowWidget.swift
          grep -q 'widget.alltime.total' NetFlowWidget/NetFlowWidget.swift

          mkdir -p Payload
          cp -R "$APP" Payload/NetFlow.app
          zip -qry NetFlow_4.2.4_build33_CN_WidgetInfo_unsigned.ipa Payload
          shasum -a 256 NetFlow_4.2.4_build33_CN_WidgetInfo_unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NetFlow-4.2.4-WidgetInfo
          path: NetFlow_4.2.4_build33_CN_WidgetInfo_unsigned.ipa
          retention-days: 7
