name: CodeQL

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: autobuild
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
