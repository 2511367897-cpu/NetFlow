name: One Shot Final Build
# retry after compile fixes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-final.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build and verify final IPA
        run: |
          set -euo pipefail
          rm -rf DerivedData Payload

          xcodebuild \
            -project NetFlow.xcodeproj \
            -scheme NetFlow \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          APP="$PWD/DerivedData/Build/Products/Release-iphoneos/NetFlow.app"
          WIDGET="$APP/PlugIns/NetFlowWidget.appex"

          test -d "$APP"
          test -d "$WIDGET"
          test -f "$APP/zh.lproj/Localizable.strings"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "4.2.3"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "32"
          /usr/libexec/PlistBuddy -c "Print :NSSupportsLiveActivities" "$APP/Info.plist"
          grep -q "struct NetFlowLiveActivity" NetFlowWidget/NetFlowWidget.swift
          grep -q "DynamicIsland" NetFlowWidget/NetFlowWidget.swift

          mkdir -p Payload
          cp -R "$APP" Payload/NetFlow.app
          zip -qry NetFlow_4.2.3_build32_CN_Final_unsigned.ipa Payload
          shasum -a 256 NetFlow_4.2.3_build32_CN_Final_unsigned.ipa

      - name: Upload final IPA
        uses: actions/upload-artifact@v4
        with:
          name: NetFlow-4.2.3-Final-IPA
          path: NetFlow_4.2.3_build32_CN_Final_unsigned.ipa
          retention-days: 7
