name: One Shot Full Audit 4.2.7

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-full-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Full audit, tests, and release build
        shell: bash
        run: |
          set +e

          STATIC_STATUS=99
          TEST_STATUS=99
          BUILD_STATUS=99
          PACKAGE_STATUS=99

          brew install xcodegen >/tmp/brew-xcodegen.log 2>&1
          if ! command -v xcodegen >/dev/null 2>&1; then
            echo "xcodegen unavailable" > audit-status.txt
            cat /tmp/brew-xcodegen.log >> audit-status.txt
            exit 0
          fi

          xcodegen generate >/tmp/xcodegen.log 2>&1
          XCODEGEN_STATUS=$?

          if [ "$XCODEGEN_STATUS" -eq 0 ]; then
            bash Tools/check_project.sh >/tmp/static-check.log 2>&1
            STATIC_STATUS=$?
          fi

          if [ "$XCODEGEN_STATUS" -eq 0 ]; then
            DEVICE_UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(dev["udid"] for devices in d.get("devices",{}).values() for dev in devices if dev.get("isAvailable") and dev.get("name","").startswith("iPhone")), "")')
            if [ -n "$DEVICE_UDID" ]; then
              xcodebuild \
                -project NetFlow.xcodeproj \
                -scheme NetFlow \
                -configuration Debug \
                -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
                CODE_SIGNING_ALLOWED=NO \
                test >/tmp/xctest.log 2>&1
              TEST_STATUS=$?
            else
              echo "No available iPhone simulator" >/tmp/xctest.log
              TEST_STATUS=98
            fi
          fi

          if [ "$XCODEGEN_STATUS" -eq 0 ]; then
            rm -rf DerivedData Payload
            xcodebuild \
              -project NetFlow.xcodeproj \
              -scheme NetFlow \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath "$PWD/DerivedData" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              build >/tmp/release-build.log 2>&1
            BUILD_STATUS=$?
          fi

          if [ "$BUILD_STATUS" -eq 0 ]; then
            APP="$PWD/DerivedData/Build/Products/Release-iphoneos/NetFlow.app"
            WIDGET="$APP/PlugIns/NetFlowWidget.appex"

            if [ -d "$APP" ] \
              && [ -d "$WIDGET" ] \
              && [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "4.2.7" ] \
              && [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "36" ] \
              && [ "$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP/Info.plist")" = "true" ] \
              && [ -f "$APP/zh.lproj/Localizable.strings" ]; then
                mkdir -p Payload
                cp -R "$APP" Payload/NetFlow.app
                zip -qry NetFlow_4.2.7_build36_CN_Audited_unsigned.ipa Payload
                PACKAGE_STATUS=$?
            else
                PACKAGE_STATUS=97
            fi
          fi

          {
            echo "xcodegen=$XCODEGEN_STATUS"
            echo "static=$STATIC_STATUS"
            echo "tests=$TEST_STATUS"
            echo "release_build=$BUILD_STATUS"
            echo "package=$PACKAGE_STATUS"
          } > audit-status.txt

          if [ -f NetFlow_4.2.7_build36_CN_Audited_unsigned.ipa ]; then
            shasum -a 256 NetFlow_4.2.7_build36_CN_Audited_unsigned.ipa > ipa.sha256
          fi

          cp /tmp/xcodegen.log xcodegen.log 2>/dev/null || true
          cp /tmp/static-check.log static-check.log 2>/dev/null || true
          cp /tmp/xctest.log xctest.log 2>/dev/null || true
          cp /tmp/release-build.log release-build.log 2>/dev/null || true

          cat audit-status.txt
          exit 0

      - name: Upload audit result
        uses: actions/upload-artifact@v4
        with:
          name: NetFlow-4.2.7-Full-Audit
          path: |
            audit-status.txt
            ipa.sha256
            NetFlow_4.2.7_build36_CN_Audited_unsigned.ipa
            xcodegen.log
            static-check.log
            xctest.log
            release-build.log
          if-no-files-found: warn
          retention-days: 7
