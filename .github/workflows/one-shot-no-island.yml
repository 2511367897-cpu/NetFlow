name: One Shot No Island Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-no-island.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify, build, and package
        shell: bash
        run: |
          set +e
          brew install xcodegen >/tmp/brew.log 2>&1
          xcodegen generate >/tmp/xcodegen.log 2>&1
          XCODEGEN=$?

          STATIC=99
          BUILD=99
          PACKAGE=99
          VERIFY=99

          if [ "$XCODEGEN" -eq 0 ]; then
            bash Tools/check_project.sh >/tmp/static.log 2>&1
            STATIC=$?
          fi

          if [ "$XCODEGEN" -eq 0 ]; then
            rm -rf DerivedData Payload
            xcodebuild \
              -project NetFlow.xcodeproj \
              -scheme NetFlow \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath "$PWD/DerivedData" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              build >/tmp/build.log 2>&1
            BUILD=$?
          fi

          if [ "$BUILD" -eq 0 ]; then
            APP="$PWD/DerivedData/Build/Products/Release-iphoneos/NetFlow.app"
            WIDGET="$APP/PlugIns/NetFlowWidget.appex"
            VERIFY=0

            [ -d "$APP" ] || VERIFY=1
            [ -d "$WIDGET" ] || VERIFY=1
            [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" 2>/dev/null)" = "4.2.8" ] || VERIFY=1
            [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" 2>/dev/null)" = "37" ] || VERIFY=1

            if /usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP/Info.plist" >/dev/null 2>&1; then
              VERIFY=1
            fi

            if grep -q 'NetFlowLiveActivity\|DynamicIsland\|ActivityConfiguration' NetFlowWidget/NetFlowWidget.swift; then
              VERIFY=1
            fi

            if [ -f NetFlow/Services/LiveActivityManager.swift ]; then
              VERIFY=1
            fi

            if [ "$VERIFY" -eq 0 ]; then
              mkdir -p Payload
              cp -R "$APP" Payload/NetFlow.app
              zip -qry NetFlow_4.2.8_build37_CN_NoIsland_unsigned.ipa Payload
              PACKAGE=$?
            fi
          fi

          {
            echo "xcodegen=$XCODEGEN"
            echo "static=$STATIC"
            echo "build=$BUILD"
            echo "verify_no_live_activity=$VERIFY"
            echo "package=$PACKAGE"
          } > build-status.txt

          [ -f NetFlow_4.2.8_build37_CN_NoIsland_unsigned.ipa ] && shasum -a 256 NetFlow_4.2.8_build37_CN_NoIsland_unsigned.ipa > ipa.sha256
          cp /tmp/static.log static.log 2>/dev/null || true
          cp /tmp/build.log build.log 2>/dev/null || true
          cat build-status.txt
          exit 0

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: NetFlow-4.2.8-NoIsland
          path: |
            build-status.txt
            ipa.sha256
            NetFlow_4.2.8_build37_CN_NoIsland_unsigned.ipa
            static.log
            build.log
          if-no-files-found: warn
          retention-days: 7
