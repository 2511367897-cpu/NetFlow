name: Build Chinese Widget IPA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-widget-ipa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Add Chinese localization and WidgetKit extension
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import plistlib

          root = Path.cwd()
          def write(path, content):
              p = root / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding="utf-8")

          zh = r'''"overview" = "概览";
          "history" = "历史";
          "data_plan" = "流量套餐";
          "settings" = "设置";
          "cellular" = "蜂窝网络";
          "wifi" = "Wi‑Fi";
