          "export_year_pdf" = "导出年度 PDF";
          "network_report" = "网络流量使用报告";
          "data" = "数据";
          "reset_all" = "删除全部数据";
          "privacy" = "隐私";
          "privacy_local_only" = "所有数据仅保存在本机。此 App 不记录浏览内容，也不会将流量使用数据发送到服务器。";
          "connected" = "已连接";
          "not_connected" = "未连接";
          "not_active" = "未启用";
          "today" = "今天";
          "local_ip" = "本地 IP";
          "public_ip" = "公网 IP";
          "vpn_connected" = "已连接";
          "vpn_disconnected" = "未连接";
          "vpn_ip" = "VPN IP";
          "vpn_unknown_app" = "无法获取 VPN App 名称";
          "vpn_system_tunnel" = "系统 VPN 通道";
          "wifi_name_unavailable" = "Wi‑Fi 不可用";
          "location_unavailable" = "位置不可用";
          "current_location" = "当前位置";
          "cellular_data" = "蜂窝数据";
          "vpn" = "VPN";
          "days_7" = "7 天";
          "days_30" = "30 天";
          "days_365" = "365 天";
          "chart_day" = "日期";
          "default_plan_name" = "流量套餐";
          "location_approximate_vietnam" = "大致位置：越南";
          "location_approximate_network" = "大致网络位置";
          "pdf_date_range" = "从 %@ 到 %@";
          "pdf_plan_cycle" = "套餐：%@ • 周期：%@";
          "pdf_daily_details" = "每日详情";
          "pdf_columns" = "日期                蜂窝网络 ↓/↑                 Wi‑Fi ↓/↑                    总计";
          "pdf_estimated" = "（估算）";
          "pdf_total" = "总计";
          "pdf_cellular_data" = "蜂窝数据：%@";
          "pdf_wifi" = "Wi‑Fi：%@";
          "pdf_total_data" = "总流量：%@";
          "system_information" = "系统能力";
          "system_capabilities" = "可用功能";
          "environment_checking" = "正在检查运行环境";
          "environment_checking_detail" = "NetFlow 正在检查当前权限以及实际可用的系统功能。";
          "environment_full" = "完整环境";
          "environment_full_detail" = "App 可独立运行，大多数增强功能均可使用。";
          "environment_standard" = "标准环境";
          "environment_standard_detail" = "核心功能可正常使用；部分附加功能取决于签名与权限配置。";
          "environment_limited" = "受限环境";
          "environment_limited_detail" = "流量统计和报告仍可使用，但部分系统权限不可用。";
          "cap_available" = "可用";
          "cap_limited" = "受限";
          "cap_unavailable" = "不可用";
          "cap_unknown" = "未知";
          "cap_usage" = "流量统计";
          "cap_usage_detail" = "读取设备 Wi‑Fi 与蜂窝网络接口的流量计数。";
          "cap_reports" = "PDF 报告";
          "cap_reports_detail" = "可导出包含每日详情的日度、月度和年度报告。";
          "cap_notifications" = "流量提醒";
          "cap_notifications_detail" = "需要你授予通知权限。";
          "cap_background" = "后台刷新";
          "cap_background_detail" = "由 iOS 调度，无法保证持续在后台运行。";
          "cap_location" = "位置与天气";
          "cap_location_detail" = "使用大致位置显示当地天气。";
          "cap_ssid" = "Wi‑Fi 连接";
          "cap_ssid_detail" = "显示 Wi‑Fi 当前是否处于连接状态。";
          "cap_public_ip" = "公网 IP";
          "cap_public_ip_detail" = "需要联网；VPN 启用时显示的是经过 VPN 后的公网 IP。";
          "cap_vpn" = "VPN 检测";
          "cap_vpn_detail" = "当 iOS 提供相关信息时，检测 VPN 通道接口与连接状态。";
          "cap_widgets" = "主屏幕小组件";
          "cap_widgets_detail" = "IPA 内含并正确签名 Widget 扩展时可用。";
          "cap_live_activities" = "实时活动";
          "cap_live_activities_detail" = "需要 ActivityKit、正确的 Info.plist 配置以及合适的签名。";
          "capability_signing_note" = "同一个 IPA 可以根据当前实际权限自动适配，但签名完成后无法再新增 entitlement。";
          "notification_usage_title" = "流量使用提醒";
          "notification_usage_body" = "%@ 已达到提醒阈值。剩余：%@。";
          "unit" = "单位";
          "carrier" = "蜂窝数据";
          "carrier_unavailable" = "蜂窝数据不可用";
          "cycle_ends" = "周期结束";
          "last_updated" = "最后更新";
          "done" = "完成";
          "refresh" = "刷新";
          "rain_probability" = "降雨概率";
          "about" = "关于";
          "version" = "版本";
          "build" = "构建";
          "build_date" = "构建日期";
          "author" = "作者";
          "unknown" = "未知";
          "month" = "月";
          "year" = "年";
          "forecast" = "流量预测";
          "average_per_day" = "日均使用";
          "projected_cycle_usage" = "预计本周期用量";
          "forecast_over_limit" = "预计将超出套餐额度";
          "forecast_within_limit" = "预计不会超出套餐额度";
          "export_month_csv" = "导出月度 CSV";
          "export_year_csv" = "导出年度 CSV";
          "export_backup" = "导出备份";
          "import_backup" = "恢复备份";
          "backup_restored" = "备份已成功恢复。";
          "backup_restore_failed" = "无法恢复此备份。";
          "export_failed" = "无法导出文件。";
          '''
          write("NetFlow/Resources/zh.lproj/Localizable.strings", zh)
          write("NetFlow/Resources/zh.lproj/InfoPlist.strings", '''"CFBundleDisplayName" = "NetFlow";
          "NSLocalNetworkUsageDescription" = "NetFlow 需要读取本地网络信息，用于显示当前连接状态。";
          "NSLocationWhenInUseUsageDescription" = "NetFlow 使用你的当前位置显示当地天气。";
          ''')

          info_path = root / "NetFlow/Info.plist"
          with info_path.open("rb") as f:
              info = plistlib.load(f)
          locs = list(info.get("CFBundleLocalizations", []))
          if "zh" not in locs:
              locs.append("zh")
          info["CFBundleLocalizations"] = locs
          with info_path.open("wb") as f:
              plistlib.dump(info, f)

          write("NetFlow/NetFlow.entitlements", '''<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>com.apple.security.application-groups</key>
          <array><string>group.com.duyhoang.netflow</string></array>
          </dict></plist>
          ''')

          write("NetFlow/Services/WidgetBridge.swift", r'''
          import Foundation
          import WidgetKit

          enum NetFlowWidgetBridge {
              static let group = "group.com.duyhoang.netflow"
              static let kind = "NetFlowUsageWidget"

              static func publish(records: [DailyUsageRecord], plan: DataPlan, rate: NetworkRate, now: Date = Date()) {
                  guard let d = UserDefaults(suiteName: group) else { return }
                  let today = records.first { Calendar.current.isDateInToday($0.date) }
                  let cellular = today?.cellularTotalBytes ?? 0
                  let wifi = today?.wifiTotalBytes ?? 0
                  let total = cellular &+ wifi
                  let remaining = plan.isUnlimited ? 0 : plan.remainingBytes(records: records, at: now)

                  d.set(Double(total), forKey: "widget.today.total")
                  d.set(Double(cellular), forKey: "widget.today.cellular")
                  d.set(Double(wifi), forKey: "widget.today.wifi")
                  d.set(Double(remaining), forKey: "widget.plan.remaining")
                  d.set(plan.isUnlimited, forKey: "widget.plan.unlimited")
                  d.set(rate.cellularDown + rate.wifiDown, forKey: "widget.rate.down")
                  d.set(rate.cellularUp + rate.wifiUp, forKey: "widget.rate.up")
                  d.set(now.timeIntervalSince1970, forKey: "widget.updatedAt")

                  let last = d.double(forKey: "widget.lastReloadRequest")
                  if now.timeIntervalSince1970 - last >= 60 {
                      d.set(now.timeIntervalSince1970, forKey: "widget.lastReloadRequest")
                      WidgetCenter.shared.reloadTimelines(ofKind: kind)
                  }
              }
          }
          ''')

          appstore_path = root / "NetFlow/App/AppStore.swift"
          s = appstore_path.read_text(encoding="utf-8")
          old = '''    func save() {
                  persistence.save(settings: settings, plan: plan, records: dailyRecords, alerts: alerts)
              }
          '''
          new = '''    func save() {
                  persistence.save(settings: settings, plan: plan, records: dailyRecords, alerts: alerts)
                  NetFlowWidgetBridge.publish(
                      records: dailyRecords,
                      plan: plan,
                      rate: currentRate
                  )
              }
          '''
          if old not in s:
              raise SystemExit("Could not patch AppStore.save()")
          appstore_path.write_text(s.replace(old, new), encoding="utf-8")

          write("NetFlowWidget/NetFlowWidget.entitlements", '''<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>com.apple.security.application-groups</key>
          <array><string>group.com.duyhoang.netflow</string></array>
          </dict></plist>
          ''')

          write("NetFlowWidget/Info.plist", '''<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleDevelopmentRegion</key><string>zh</string>
          <key>CFBundleDisplayName</key><string>NetFlow</string>
          <key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string>
          <key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
          <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
          <key>CFBundleName</key><string>$(PRODUCT_NAME)</string>
          <key>CFBundlePackageType</key><string>XPC!</string>
          <key>CFBundleShortVersionString</key><string>4.2.0</string>
          <key>CFBundleVersion</key><string>29</string>
          <key>NSExtension</key><dict>
              <key>NSExtensionPointIdentifier</key><string>com.apple.widgetkit-extension</string>
          </dict>
          </dict></plist>
          ''')

          write("NetFlowWidget/NetFlowWidget.swift", r'''
          import WidgetKit
          import SwiftUI
          import UIKit

          private let groupID = "group.com.duyhoang.netflow"

          private struct UsageSnapshot {
              var total: UInt64 = 0
              var cellular: UInt64 = 0
              var wifi: UInt64 = 0
              var remaining: UInt64 = 0
              var unlimited = false
              var down: Double = 0
              var up: Double = 0
              var updatedAt = Date()

              static func load() -> UsageSnapshot {
                  guard let d = UserDefaults(suiteName: groupID) else { return UsageSnapshot() }
                  func bytes(_ key: String) -> UInt64 {
                      let v = d.double(forKey: key)
                      guard v.isFinite, v > 0 else { return 0 }
                      return v >= Double(UInt64.max) ? UInt64.max : UInt64(v)
                  }
                  let t = d.double(forKey: "widget.updatedAt")
                  return UsageSnapshot(
                      total: bytes("widget.today.total"),
                      cellular: bytes("widget.today.cellular"),
                      wifi: bytes("widget.today.wifi"),
                      remaining: bytes("widget.plan.remaining"),
                      unlimited: d.bool(forKey: "widget.plan.unlimited"),
                      down: d.double(forKey: "widget.rate.down"),
                      up: d.double(forKey: "widget.rate.up"),
                      updatedAt: t > 0 ? Date(timeIntervalSince1970: t) : Date()
                  )
              }
          }

          private struct Entry: TimelineEntry {
              let date: Date
              let snapshot: UsageSnapshot
          }

          private struct Provider: TimelineProvider {
              func placeholder(in context: Context) -> Entry {
                  Entry(date: Date(), snapshot: UsageSnapshot(
                      total: 3_260_000_000,
                      cellular: 1_820_000_000,
                      wifi: 1_440_000_000,
                      remaining: 18_400_000_000,
                      down: 2_400_000,
                      up: 320_000,
                      updatedAt: Date()
                  ))
              }

              func getSnapshot(in context: Context, completion: @escaping (Entry) -> Void) {
                  completion(Entry(date: Date(), snapshot: .load()))
              }

              func getTimeline(in context: Context, completion: @escaping (Timeline<Entry>) -> Void) {
                  let now = Date()
                  let entry = Entry(date: now, snapshot: .load())
                  completion(Timeline(entries: [entry], policy: .after(now.addingTimeInterval(15 * 60))))
              }
          }

          private enum Fmt {
              static func bytes(_ b: UInt64) -> String {
                  ByteCountFormatter.string(fromByteCount: Int64(clamping: b), countStyle: .decimal)
              }
              static func rate(_ bytesPerSecond: Double) -> String {
                  let bits = max(bytesPerSecond, 0) * 8
                  if bits >= 1_000_000 { return String(format: "%.1f Mbps", bits / 1_000_000) }
                  if bits >= 1_000 { return String(format: "%.0f Kbps", bits / 1_000) }
                  return String(format: "%.0f bps", bits)
              }
              static func time(_ d: Date) -> String {
                  d.formatted(date: .omitted, time: .shortened)
              }
          }

          private struct WidgetView: View {
              @Environment(\.widgetFamily) private var family
              let entry: Entry

              var body: some View {
                  Group {
                      switch family {
                      case .systemMedium: medium
                      case .accessoryRectangular: lockRect
                      case .accessoryInline: lockInline
                      default: small
                      }
                  }
                  .widgetURL(URL(string: "netflow://open"))
              }

              private var small: some View {
                  VStack(alignment: .leading, spacing: 8) {
                      Label("今日流量", systemImage: "chart.bar.fill")
                          .font(.caption.weight(.semibold))
                      Text(Fmt.bytes(entry.snapshot.total))
                          .font(.system(.title2, design: .rounded, weight: .bold))
                          .minimumScaleFactor(0.65).lineLimit(1)
                      HStack(spacing: 8) {
                          metric("蜂窝", Fmt.bytes(entry.snapshot.cellular), "antenna.radiowaves.left.and.right")
                          metric("Wi‑Fi", Fmt.bytes(entry.snapshot.wifi), "wifi")
                      }
                      Text("更新 " + Fmt.time(entry.snapshot.updatedAt))
                          .font(.caption2).foregroundStyle(.secondary)
                  }
                  .padding()
                  .widgetBackground()
              }

              private var medium: some View {
                  HStack(spacing: 16) {
                      VStack(alignment: .leading, spacing: 7) {
                          Label("今日总流量", systemImage: "chart.bar.fill")
                              .font(.caption.weight(.semibold))
                          Text(Fmt.bytes(entry.snapshot.total))
                              .font(.system(.title2, design: .rounded, weight: .bold))
                              .lineLimit(1)
                          row("蜂窝", Fmt.bytes(entry.snapshot.cellular), "antenna.radiowaves.left.and.right")
                          row("Wi‑Fi", Fmt.bytes(entry.snapshot.wifi), "wifi")
                      }
                      Divider()
                      VStack(alignment: .leading, spacing: 8) {
                          Text(entry.snapshot.unlimited ? "套餐：不限量" : "剩余 " + Fmt.bytes(entry.snapshot.remaining))
                              .font(.caption.weight(.semibold))
                          Label(Fmt.rate(entry.snapshot.down), systemImage: "arrow.down.circle.fill").font(.caption)
                          Label(Fmt.rate(entry.snapshot.up), systemImage: "arrow.up.circle.fill").font(.caption)
                          Spacer(minLength: 0)
                          Text("更新 " + Fmt.time(entry.snapshot.updatedAt))
                              .font(.caption2).foregroundStyle(.secondary)
                      }
                  }
                  .padding()
                  .widgetBackground()
              }

              private var lockRect: some View {
                  VStack(alignment: .leading, spacing: 2) {
                      Text("今日 " + Fmt.bytes(entry.snapshot.total)).font(.headline).lineLimit(1)
                      Text("蜂窝 " + Fmt.bytes(entry.snapshot.cellular) + " · Wi‑Fi " + Fmt.bytes(entry.snapshot.wifi))
                          .font(.caption2).lineLimit(1)
                  }
              }

              private var lockInline: some View {
                  Text("今日流量 " + Fmt.bytes(entry.snapshot.total))
              }

              private func metric(_ title: String, _ value: String, _ icon: String) -> some View {
                  VStack(alignment: .leading, spacing: 2) {
                      Label(title, systemImage: icon).font(.caption2).foregroundStyle(.secondary)
                      Text(value).font(.caption.weight(.semibold)).lineLimit(1).minimumScaleFactor(0.65)
                  }
                  .frame(maxWidth: .infinity, alignment: .leading)
              }

              private func row(_ title: String, _ value: String, _ icon: String) -> some View {
                  HStack(spacing: 5) {
                      Image(systemName: icon)
                      Text(title)
                      Spacer()
                      Text(value).fontWeight(.semibold)
                  }
                  .font(.caption)
              }
          }

          private extension View {
              @ViewBuilder
              func widgetBackground() -> some View {
                  if #available(iOSApplicationExtension 17.0, *) {
                      self.containerBackground(for: .widget) {
                          Color(uiColor: .secondarySystemBackground)
                      }
                  } else {
                      self.background(Color(uiColor: .secondarySystemBackground))
                  }
              }
          }

          private struct NetFlowUsageWidget: Widget {
              let kind = "NetFlowUsageWidget"
              var body: some WidgetConfiguration {
                  StaticConfiguration(kind: kind, provider: Provider()) { entry in
                      WidgetView(entry: entry)
                  }
                  .configurationDisplayName("NetFlow 今日流量")
                  .description("显示今日总流量、蜂窝网络、Wi‑Fi、套餐剩余和最近网速。")
                  .supportedFamilies([.systemSmall, .systemMedium, .accessoryRectangular, .accessoryInline])
              }
          }

          @main
          struct NetFlowWidgetBundle: WidgetBundle {
              var body: some Widget {
                  NetFlowUsageWidget()
              }
          }
          ''')

          project = r'''
          name: NetFlow
          options:
            developmentLanguage: en
            projectFormat: xcode15_0
            deploymentTarget:
              iOS: "16.0"
            xcodeVersion: "15.0"

          targets:
            NetFlow:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: NetFlow
                  excludes:
                    - Preview
              resources:
                - path: NetFlow/Resources/Assets.xcassets
                - path: NetFlow/Resources/en.lproj
                - path: NetFlow/Resources/vi.lproj
                - path: NetFlow/Resources/zh.lproj
              dependencies:
                - target: NetFlowWidget
                  embed: true
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.duyhoang.netflow
                  PRODUCT_NAME: NetFlow
                  SWIFT_VERSION: 5.0
                  SWIFT_STRICT_CONCURRENCY: minimal
                  CODE_SIGN_ENTITLEMENTS: NetFlow/NetFlow.entitlements
                  MARKETING_VERSION: 4.2.0
                  CURRENT_PROJECT_VERSION: 29
                  TARGETED_DEVICE_FAMILY: "1,2"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  GENERATE_INFOPLIST_FILE: NO
                  INFOPLIST_FILE: NetFlow/Info.plist

            NetFlowWidget:
              type: app-extension
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: NetFlowWidget
                  excludes:
                    - Info.plist
                    - NetFlowWidget.entitlements
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.duyhoang.netflow.widget
                  PRODUCT_NAME: NetFlowWidget
                  SWIFT_VERSION: 5.0
                  SWIFT_STRICT_CONCURRENCY: minimal
                  CODE_SIGN_ENTITLEMENTS: NetFlowWidget/NetFlowWidget.entitlements
                  GENERATE_INFOPLIST_FILE: NO
                  INFOPLIST_FILE: NetFlowWidget/Info.plist
                  SKIP_INSTALL: YES
                  APPLICATION_EXTENSION_API_ONLY: YES

            NetFlowTests:
              type: bundle.unit-test
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: NetFlowTests
              dependencies:
                - target: NetFlow
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.duyhoang.netflow.tests
                  GENERATE_INFOPLIST_FILE: YES
                  TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NetFlow.app/NetFlow"
                  BUNDLE_LOADER: "$(TEST_HOST)"
          '''
          write("project.yml", project)
          PY

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app with widget
        run: |
          rm -rf DerivedData Payload
          xcodebuild \
            -project NetFlow.xcodeproj \
            -scheme NetFlow \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          APP="$PWD/DerivedData/Build/Products/Release-iphoneos/NetFlow.app"
          test -d "$APP"
          test -d "$APP/PlugIns/NetFlowWidget.appex"
          mkdir -p Payload
          cp -R "$APP" Payload/NetFlow.app
          zip -qry NetFlow_4.2.0_build29_简体中文_Widget_未签名.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
