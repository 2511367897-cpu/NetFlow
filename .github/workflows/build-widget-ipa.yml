name: Build Chinese Widget IPA

on:
  push:
    branches: [main]
    paths:
      - "NetFlow/**"
      - "NetFlowWidget/**"
      - "project.yml"
      - ".github/workflows/build-widget-ipa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app + widget
        run: |
          rm -rf DerivedData Payload
          xcodebuild             -project NetFlow.xcodeproj             -scheme NetFlow             -configuration Release             -sdk iphoneos             -derivedDataPath "$PWD/DerivedData"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build

          APP="$PWD/DerivedData/Build/Products/Release-iphoneos/NetFlow.app"

          test -d "$APP"
          test -d "$APP/PlugIns/NetFlowWidget.appex"
          test -f "$APP/zh.lproj/Localizable.strings"

          mkdir -p Payload
          cp -R "$APP" Payload/NetFlow.app
          zip -qry NetFlow_4.2.1_build30_CN_UsageUI_Widget_unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NetFlow-UsageUI-InteractiveWidget-IPA
          path: NetFlow_4.2.1_build30_CN_UsageUI_Widget_unsigned.ipa
          retention-days: 7
