name: Final Live Activity IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build and verify
        run: |
          rm -rf DerivedData Payload
          xcodebuild \
            -project NetFlow.xcodeproj \
            -scheme NetFlow \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          APP="$PWD/DerivedData/Build/Products/Release-iphoneos/NetFlow.app"
          test -d "$APP"
          test -d "$APP/PlugIns/NetFlowWidget.appex"
          test -f "$APP/zh.lproj/Localizable.strings"

          /usr/libexec/PlistBuddy -c "Print :NSSupportsLiveActivities" "$APP/Info.plist" | grep -q true

          mkdir -p Payload
          cp -R "$APP" Payload/NetFlow.app
          zip -qry NetFlow_4.2.2_build31_CN_LiveActivity_Final_unsigned.ipa Payload
          shasum -a 256 NetFlow_4.2.2_build31_CN_LiveActivity_Final_unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NetFlow-4.2.2-LiveActivity-Final
          path: NetFlow_4.2.2_build31_CN_LiveActivity_Final_unsigned.ipa
          retention-days: 7
