name: Build NetFlow IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project NetFlow.xcodeproj \
            -scheme NetFlow \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NetFlow.app Payload/
          /usr/bin/zip -qry NetFlow-4.2.12-build41-unsigned.ipa Payload
          ls -lh NetFlow-4.2.12-build41-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetFlow-4.2.12-build41-unsigned
          path: NetFlow-4.2.12-build41-unsigned.ipa
          if-no-files-found: error
