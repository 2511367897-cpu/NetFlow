name: Build FlowLedger prototype IPA

on:
  push:
    branches:
      - codex/flowledger-native
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate project sources and resources
        run: bash Tools/check_project.sh

      - name: Run accounting and calibration tests
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["isAvailable"] and x["name"].startswith("iPhone")))')
          xcodebuild \
            -project NetFlow.xcodeproj \
            -scheme NetFlow \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO \
            -derivedDataPath test-build \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Capture native app smoke screenshot
        run: |
          DEVICE_ID=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.jack.flowledger --ui-smoke
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot FlowLedger-first-launch.png

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project NetFlow.xcodeproj \
            -scheme NetFlow \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NetFlow.app Payload/
          /usr/bin/zip -qry FlowLedger-0.1.0-build1-unsigned.ipa Payload
          sh Tools/validate_ipa.sh FlowLedger-0.1.0-build1-unsigned.ipa
          ls -lh FlowLedger-0.1.0-build1-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowLedger-0.1.0-build1-unsigned
          path: FlowLedger-0.1.0-build1-unsigned.ipa
          if-no-files-found: error

      - name: Upload generated project and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlowLedger-build-evidence
          path: |
            NetFlow.xcodeproj
            FlowLedger-first-launch.png
            test-build/Logs/Test/*.xcresult
          if-no-files-found: warn
